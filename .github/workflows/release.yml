name: Release

# Triggered when you push a new tag matching v*.*.*  (e.g., v2.0.0, v2.1.0-beta).
# Packages the extension as Chrome and Firefox zips, validates both, creates a
# GitHub Release with auto-generated notes, and attaches both zips as release
# assets.
#
# Typical flow:
#   git tag v2.0.0
#   git push origin v2.0.0

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  package:
    if: ${{ github.event.created && !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # ── Chrome build ──────────────────────────────────────────────────
      - name: Build Chrome release zip
        run: |
          ZIP_NAME="static-${GITHUB_REF_NAME}.zip"
          # Exclude repo-infra, dev-only, and secret-bearing files so the zip
          # contains only the runtime files Chrome actually loads.
          zip -r "$ZIP_NAME" . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".husky/*" \
            -x "_metadata/*" \
            -x ".pi/*" \
            -x ".agents/*" \
            -x ".claude/*" \
            -x ".grok/*" \
            -x ".zcode/*" \
            -x "skills-lock.json" \
            -x "node_modules/*" \
            -x "tests/*" \
            -x "docs/*" \
            -x "test-results/*" \
            -x ".editorconfig" \
            -x ".prettierrc" \
            -x ".prettierignore" \
            -x ".gitignore" \
            -x ".markdownlint.json" \
            -x "eslint.config.mjs" \
            -x "playwright.config.js" \
            -x "gate.sh" \
            -x "package.json" \
            -x "package-lock.json" \
            -x "build-firefox.js" \
            -x "IMPROVEMENTS.md" \
            -x "*.diag" \
            -x "*.pem" \
            -x "*.key" \
            -x "*.p12" \
            -x "*.pfx" \
            -x "*.env" \
            -x "*.env.*" \
            -x ".env" \
            -x ".env.*" \
            -x ".netrc" \
            -x ".npmrc" \
            -x "*.zip" \
            -x ".DS_Store" \
            -x "Thumbs.db"
          echo "CHROME_ZIP=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "--- Chrome zip contents ---"
          unzip -l "$ZIP_NAME"

      - name: Validate Chrome release package
        run: |
          TMP_DIR="$(mktemp -d)"
          unzip -q "$CHROME_ZIP" -d "$TMP_DIR"
          node -e '
            const fs = require("fs");
            const path = require("path");
            const vm = require("vm");
            const root = process.argv[1];
            const read = (file) => fs.readFileSync(path.join(root, file), "utf8");
            const manifest = JSON.parse(read("manifest.json"));
            const required = new Set(["manifest.json", "lists.js", "service_worker_utils.js"]);
            // The service worker registers the content scripts from these lists;
            // a missing file would leave every site unprotected at runtime.
            try {
              const context = vm.createContext({ URL });
              vm.runInContext(read("lists.js"), context);
              vm.runInContext(read("service_worker_utils.js"), context);
              const utils = context.__static_sw_utils__;
              for (const script of utils.MAIN_WORLD_SCRIPTS) required.add(script.file);
              for (const file of utils.ISOLATED_WORLD_SCRIPTS) required.add(file);
            } catch (error) {
              console.error("Cannot read the content-script lists:", error.message);
              process.exit(1);
            }
            if (manifest.background && manifest.background.service_worker) {
              required.add(manifest.background.service_worker);
            }
            if (manifest.action && manifest.action.default_popup) {
              required.add(manifest.action.default_popup);
            }
            for (const rs of (manifest.declarative_net_request && manifest.declarative_net_request.rule_resources) || []) {
              required.add(rs.path);
            }
            const missing = [...required].filter((f) => !fs.existsSync(path.join(root, f)));
            if (missing.length) {
              console.error("Missing runtime files in release zip:", missing);
              process.exit(1);
            }
            console.log("Chrome release package OK:", [...required].length, "runtime files present.");
          ' "$TMP_DIR"

      # ── Firefox build ─────────────────────────────────────────────────
      - name: Build Firefox release zip
        run: |
          FIREFOX_ZIP="static-${GITHUB_REF_NAME}-firefox.zip"
          node build-firefox.js "$FIREFOX_ZIP"
          echo "FIREFOX_ZIP=$FIREFOX_ZIP" >> "$GITHUB_ENV"

      - name: Validate Firefox package with web-ext lint
        run: |
          TMP_DIR="$(mktemp -d)"
          unzip -q "$FIREFOX_ZIP" -d "$TMP_DIR"
          npx web-ext lint --source-dir "$TMP_DIR"
          rm -rf "$TMP_DIR"

      # ── Release ───────────────────────────────────────────────────────
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            ${{ env.CHROME_ZIP }}
            ${{ env.FIREFOX_ZIP }}
          generate_release_notes: true
          body: |
            ## Install

            ### Chrome / Chromium
            **From the [Chrome Web Store](https://chromewebstore.google.com/detail/static/lljfncchalimoimbencbbblpdbhmeiil):** install Static with one click.

            Or load from the release zip:
            1. Download `${{ env.CHROME_ZIP }}` below and extract it to a folder.
            2. Open `chrome://extensions`, enable **Developer mode** (top right).
            3. Click **Load unpacked** and select the extracted folder.

            ### Firefox
            **From [Firefox Add-ons](https://addons.mozilla.org/en-US/firefox/addon/privacystatic/):** install Static with one click.

            Or load temporarily from the release zip:
            1. Download `${{ env.FIREFOX_ZIP }}` below and extract it to a folder.
            2. Open `about:debugging#/runtime/this-firefox`.
            3. Click **Load Temporary Add-on…** and select any file in the extracted folder.

            Temporary add-ons unload when Firefox restarts; prefer the Firefox Add-ons listing for a permanent install.

            See [CHANGELOG.md](https://github.com/G-man3207/Static/blob/main/CHANGELOG.md) for the full release notes.
